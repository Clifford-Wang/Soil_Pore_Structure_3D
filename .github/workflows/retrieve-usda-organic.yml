name: Retrieve USDA organic-matter soil CT reference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retrieve-usda-organic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-usda-ct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download annotated USDA soil aggregate data
        shell: bash
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import pathlib,requests,time,zipfile
          urls=[
            'https://ndownloader.figshare.com/files/44531243',
            'https://figshare.com/ndownloader/files/44531243',
            'https://api.figshare.com/v2/file/download/44531243',
            'https://ndownloader.figshare.com/files/44531243?download=1',
            'https://s3-us-east-2.amazonaws.com/figshare-production-eu-usda-storage1731-us-east-2/44531243/forest_soil_images_masks_for_testing_training.zip'
          ]
          target=pathlib.Path('usda_organic_ct/forest_soil_images_masks_for_testing_training.zip')
          target.parent.mkdir(exist_ok=True)
          session=requests.Session()
          session.headers.update({'User-Agent':'Research-CT-Validation/1.0','Cache-Control':'no-cache'})
          ok=False
          for attempt,url in enumerate(urls,1):
            try:
              q='&' if '?' in url else '?'
              uncached=url+q+'research_fetch='+str(int(time.time()*1000))
              with session.get(uncached,stream=True,timeout=(25,150),allow_redirects=True) as response:
                print('Attempt',attempt,'HTTP',response.status_code,'bytes',response.headers.get('content-length'),flush=True)
                if response.status_code!=200:continue
                with target.open('wb') as f:
                  for chunk in response.iter_content(1024*1024):
                    if chunk:f.write(chunk)
              if zipfile.is_zipfile(target):
                print('ZIP retrieved bytes=',target.stat().st_size,flush=True)
                with zipfile.ZipFile(target) as z:
                  print('Entries:',[(x.filename,x.file_size) for x in z.infolist()[:60]],flush=True)
                ok=True
                break
              print('Response was not ZIP.',flush=True)
            except Exception as e:
              print('Attempt error type=',type(e).__name__,flush=True)
          if not ok:raise RuntimeError('USDA Figshare mirrors unavailable or not valid zip')
          PY
      - name: Upload public annotated soil CT for private validation
        uses: actions/upload-artifact@v4
        with:
          name: USDA-Forest-Soil-Organic-Annotated-CT
          path: usda_organic_ct/*
          if-no-files-found: error
