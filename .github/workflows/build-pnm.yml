name: Build Pore Network Native CUDA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pnm.yml'
      - '.private/pnm/source.enc'
      - 'Pore_Network_Model/config_pnm.txt'

permissions:
  contents: write

jobs:
  windows-pnm:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA 12.8 compiler
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: true
      - name: Decrypt private native source
        shell: bash
        env:
          STRUCTURE_BUILD_KEY: ${{ secrets.STRUCTURE_BUILD_KEY }}
        run: |
          set -euo pipefail
          test -n "${STRUCTURE_BUILD_KEY:-}"
          mkdir -p .pnm_build
          if command -v openssl >/dev/null 2>&1; then OPENSSL=openssl;
          else OPENSSL="/c/Program Files/Git/usr/bin/openssl.exe"; fi
          "$OPENSSL" enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in .private/pnm/source.enc -out .pnm_build/source.tar.gz \
            -pass env:STRUCTURE_BUILD_KEY
          tar -xzf .pnm_build/source.tar.gz -C .pnm_build
          test -s .pnm_build/src/pnm_core.cpp
          test -s .pnm_build/src/main.cu
          test -s .pnm_build/src/trial_guard.cpp
      - name: Configure native Windows x64 build
        shell: pwsh
        run: cmake -S .pnm_build -B build-pnm -A x64
      - name: Execute synthetic numerical checks
        shell: pwsh
        run: |
          cmake --build build-pnm --config Release --target pnm_test --parallel
          & .\build-pnm\Release\pnm_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'PNM reference tests failed.' }
      - name: Compile CUDA PNM executable
        shell: pwsh
        run: |
          cmake --build build-pnm --config Release --target SoilPNMCUDA --parallel
          if (!(Test-Path build-pnm\Release\SoilPNMCUDA.exe)) { throw 'CUDA executable missing.' }
      - name: Package binary-only output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-pnm | Out-Null
          Copy-Item build-pnm\Release\SoilPNMCUDA.exe dist-pnm\
          Copy-Item Pore_Network_Model\config_pnm.txt dist-pnm\
          Copy-Item Pore_Network_Model\run_pnm.bat dist-pnm\
      - uses: actions/upload-artifact@v4
        with:
          name: SoilPNM-NativeCUDA
          path: dist-pnm/*
          if-no-files-found: error
      - name: Publish preview release without bot commits
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'pnm-native-preview'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Pore Network Native CUDA (Preview)' --prerelease dist-pnm/*
          } else {
            gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber dist-pnm/*
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
